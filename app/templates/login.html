{% extends "base.html" %}

{% block title %}Đăng nhập — DuLich{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-primary">Đăng nhập</h3>
                    <p class="text-muted small">Chào mừng bạn quay trở lại với DuLich</p>
                </div>
                <form action="/login" method="POST" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="name@example.com" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Nhập mật khẩu" required>
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">Đăng nhập</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <span class="text-muted">Chưa có tài khoản?</span>
                    <a href="/register" class="text-decoration-none fw-semibold">Đăng ký mới</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
